spring:
  r2dbc:
    url: ${CUSTOMER_R2DBC_URL:r2dbc:postgresql://localhost:5432/bank_customer_dev}
    username: ${CUSTOMER_DB_USERNAME}
    password: ${CUSTOMER_DB_PASSWORD}
  sql:
    init:
      mode: ${CUSTOMER_SCHEMA_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      # Conservar solo si schema.sql usa @@ como separador real.
      separator: "@@"

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}